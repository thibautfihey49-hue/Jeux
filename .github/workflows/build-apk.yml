name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 📦 Téléchargement Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: 🏗️ Compilation APK
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --export-release "Android" MondeOuvert.apk

      - name: 📤 Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MondeOuvert-APK
          path: MondeOuvert.apk
          retention-days: 30

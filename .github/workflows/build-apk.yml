name: Build APK Android
on:
  push: { branches: [main] }
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 📦 Godot + Modèles d'export
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q -j Godot_v4.3-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.3.stable
          
          ls -la ~/.local/share/godot/export_templates/4.3.stable/

      - name: 🏗️ Compilation APK
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --export-release "Android" MondeOuvert.apk

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MondeOuvert-APK
          path: MondeOuvert.apk
          retention-days: 30
